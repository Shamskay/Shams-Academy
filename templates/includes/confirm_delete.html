{% extends 'base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'school:home' %}">Home</a></li>
            <li class="breadcrumb-item"><a href="{{ cancel_url }}">{{ cancel_label }}</a></li>
            <li class="breadcrumb-item active">Confirm Delete</li>
        </ol>
    </nav>
    <h1>Confirm Delete</h1>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
                </div>
                <h4 class="text-center mb-3">Are you sure you want to delete this?</h4>
                <p class="text-center text-muted mb-4">{{ object_name }}</p>
                <p class="text-center text-danger small">This action cannot be undone.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">Yes, Delete</button>
                        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
