{% extends 'base.html' %}

{% block title %}Calculate Term Results{% endblock %}

{% block content %}
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'school:home' %}">Home</a></li>
            <li class="breadcrumb-item"><a href="{% url 'school:admin_dashboard' %}">Admin Dashboard</a></li>
            <li class="breadcrumb-item active">Calculate Term Results</li>
        </ol>
    </nav>
    <h1>Calculate Term Results</h1>
    <p class="text-muted">Recalculate term results for all students based on entered test and exam scores.</p>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="term" class="form-label">Term *</label>
                <select name="term" id="term" class="form-select" required>
                    <option value="">Select a term</option>
                    {% for term in terms %}
                    <option value="{{ term.pk }}" {% if term.pk == current_term_id %}selected{% endif %}>
                        {{ term.name }} ({{ term.start_date }} - {{ term.end_date }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="class" class="form-label">Class (optional - leave blank for all classes)</label>
                <select name="class" id="class" class="form-select">
                    <option value="">All classes</option>
                    {% for cls in classes %}
                    <option value="{{ cls.pk }}">{{ cls.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Calculate Results</button>
        </form>
    </div>
</div>
{% endblock %}
