{% extends 'base.html' %}

{% block title %}Add Student to Class{% endblock %}

{% block content %}
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'school:home' %}">Home</a></li>
            <li class="breadcrumb-item"><a href="{% url 'school:admin_dashboard' %}">Admin</a></li>
            <li class="breadcrumb-item active">Add Student to Class</li>
        </ol>
    </nav>
    <h1>Add Student to Class</h1>
    <p class="text-muted">Assign a student to an academic class</p>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Student</label>
                            {{ form.student }}
                        </div>
                        <div class="col-12">
                            <label class="form-label">Class</label>
                            {{ form.academic_class }}
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">Assign Student</button>
                        <a href="{% url 'students:admin_students' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
